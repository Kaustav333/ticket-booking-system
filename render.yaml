services:
  - type: web
    name: ticket-booking-backend
    env: python
    region: oregon
    buildCommand: "cd server && pip install -r requirements.txt"
    startCommand: "cd server && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false # Set this in the Render dashboard to your Supabase/Neon URL
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: HOLD_TTL_MINUTES
        value: 10
      - key: WAITLIST_OFFER_TTL_MINUTES
        value: 15
